# release-plz owns the CLI version, changelog, and managed release PR. The
# repository workflow owns target builds, checksums, the vX.Y.Z tag, and the
# GitHub Release so no public release exists before every binary is packaged.
[workspace]
publish = false
# Process the packages in `release-pr`; publication and GitHub-release side
# effects remain owned by the repository workflow below. Each manifest's
# unconfigured internal-registry allowlist makes the package visible to
# release-plz without making it publishable to crates.io.
release = true
release_always = false
dependencies_update = false
pr_name = "chore(release): release v{{ version }}"
pr_branch_prefix = "release-plz-"
semver_check = false
changelog_config = "cliff.toml"
git_tag_enable = false
git_release_enable = false
git_tag_name = "v{{ version }}"

# Every workspace package shares one version group. Only the `phoxal` binary
# ships from this repository; `phoxal-supervisor` belongs to the selected
# framework train and is materialized into each robot deployment release.
[[package]]
name = "phoxal-cli"
version_group = "phoxal-cli"
changelog_path = "CHANGELOG.md"

[[package]]
name = "phoxal-cli-catalog"
version_group = "phoxal-cli"

[[package]]
name = "phoxal-cli-host"
version_group = "phoxal-cli"

[[package]]
name = "phoxal-cli-observation"
version_group = "phoxal-cli"

[[package]]
name = "phoxal-cli-project"
version_group = "phoxal-cli"

[[package]]
name = "phoxal-cli-ui"
version_group = "phoxal-cli"
