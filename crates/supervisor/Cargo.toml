[package]
name = "phoxal-cli-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
# `router` opens the embedded Zenoh router in this process (organization#978).
# The supervisor is the only crate in the workspace that enables it.
phoxal-api = { workspace = true }
phoxal-bus = { workspace = true, features = ["router"] }
phoxal-model = { workspace = true }
phoxal-runtime-contract = { workspace = true }
phoxal-cli-core = { workspace = true }
phoxal-cli-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
