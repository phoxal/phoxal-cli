[package]
name = "phoxal-supervisor-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Attachment and session behavior for the Phoxal supervisor contract over phoxal-bus."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "phoxal_supervisor_client"
path = "src/lib.rs"

# Pinned to the 0.54 framework train directly - see the note in
# `crates/supervisor-api/Cargo.toml`.
[dependencies]
async-trait = "0.1.89"
phoxal-bus = "0.54.0"
phoxal-runtime-contract = "0.54.0"
phoxal-supervisor-api = { path = "../supervisor-api" }
thiserror = "2.0.18"
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
