name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release): release v')
    uses: phoxal/.github/.github/workflows/rust-ci.yml@main
    with:
      # `gilrs` reads the operator's gamepad through libudev on Linux.
      # This is the CLI's own build dependency now that the
      # joypad is a client concern rather than a robot-side tool.
      system-packages: libudev-dev pkg-config
    secrets: inherit

  architecture:
    name: architecture, dependencies, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config ripgrep
      - name: Enforce architecture
        run: bash scripts/check-architecture.sh
      # The controller releases on its own train, so this repository can pin a
      # version that train has not published. Left unchecked, the first person
      # to learn is an operator whose `simulation webots run` fails on a
      # `cargo install` of a version the index never had.
      - name: Verify the pinned Webots controller is published
        run: bash scripts/check-controller-pin.sh
      - name: Enforce used dependencies
        run: |
          cargo install cargo-machete --locked --version 0.9.2
          cargo machete --with-metadata
      - name: Verify documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
