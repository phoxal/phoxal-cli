name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release): release v')
    uses: phoxal/.github/.github/workflows/rust-ci.yml@main
    with:
      # `gilrs` reads the operator's gamepad through libudev on Linux
      # (organization#978). This is the CLI's own build dependency now that the
      # joypad is a client concern rather than a robot-side tool.
      system-packages: libudev-dev pkg-config
    secrets: inherit
