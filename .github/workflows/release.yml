name: release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  plan:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-prep/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Caller-owned gate + version. The release-prep branch
          # (release-prep/vX.Y.Z) carries the intended version; the reusable
          # release workflow verifies it against Cargo.toml on the merged commit
          # before tagging/publishing.
          echo "version=${HEAD_REF#release-prep/v}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          name=$(grep -m1 '^name = ' Cargo.toml | sed 's/name = "\(.*\)"/\1/')
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${name}" "dist/${name}-${{ matrix.target }}"
          tar -czf "dist/${name}-${{ needs.plan.outputs.version }}-${{ matrix.target }}.tar.gz" \
            -C dist "${name}-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  # Shared release seam: verify version, create the vX.Y.Z tag via the Git refs
  # API (git-push of tags is restricted here), and create-or-update the GitHub
  # Release from the uploaded binaries. Notes come from CHANGELOG.md (default).
  publish:
    needs: [plan, build]
    uses: phoxal/.github/.github/workflows/rust-github-release.yml@main
    secrets: inherit
    with:
      version: ${{ needs.plan.outputs.version }}
      asset-pattern: dist/*.tar.gz
      tag-via: api
