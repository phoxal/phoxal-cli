name: release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cli-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  plan:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-plz-')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - id: v
        run: |
          set -euo pipefail
          # The tooling-controlled release-plz branch is the release gate. Read
          # the version from the exact merged commit; the reusable publication
          # seam verifies the same commit again before tagging.
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      # `gilrs` links libudev on Linux (organization#978). The joypad is a
      # client concern now, so the shipped CLI binary needs it at build time -
      # macOS uses IOKit and needs nothing.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      # `phoxal` and `phoxald` are one product at one version (organization#978),
      # so they are built together, from the same commit and the same locked
      # graph, and packaged into the same archive.
      - name: Build the release pair
        run: >-
          cargo build
          --locked
          --release
          --target ${{ matrix.target }}
          -p phoxal-cli-client
          -p phoxal-cli-supervisor

      - name: Package
        run: |
          set -euo pipefail
          # The published asset contract is shared with the phoxal.com installer
          # (install.sh in phoxal/website) and `phoxal self upgrade`: archive
          # `phoxal-<version>-<target>.tar.gz` containing BOTH binaries, named
          # `phoxal-<target>` and `phoxald-<target>`. An archive carrying only
          # one of them is rejected by `self upgrade` rather than half applied.
          mkdir -p dist
          for bin in phoxal phoxald; do
            cp "target/${{ matrix.target }}/release/${bin}" "dist/${bin}-${{ matrix.target }}"
          done
          archive="phoxal-${{ needs.plan.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -czf "dist/${archive}" \
            -C dist "phoxal-${{ matrix.target }}" "phoxald-${{ matrix.target }}"
          # Sibling checksum asset, verified by the phoxal.com installer and
          # `self upgrade`.
          # Format: "<hex>  <archive>" (sha256sum default).
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  # Shared release seam: verify version, create the vX.Y.Z tag via the Git refs
  # API (git-push of tags is restricted here), and create-or-update the GitHub
  # Release from the uploaded binaries. Notes come from CHANGELOG.md (default).
  publish:
    needs: [plan, build]
    uses: phoxal/.github/.github/workflows/rust-github-release.yml@main
    secrets: inherit
    with:
      version: ${{ needs.plan.outputs.version }}
      asset-pattern: dist/*.tar.gz*
      tag-via: api
