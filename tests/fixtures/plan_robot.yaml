schema: robot/v0

robot:
  id: robot-v1
  namespace: dev
  structure: structure.urdf
  motion_limits:
    max_linear_speed_mps: 0.6
    max_angular_speed_radps: 2.0
  kinematic:
    kind: differential
    left_actuators: [left_drive.motor]
    right_actuators: [right_drive.motor]
    left_encoders: [left_drive.encoder]
    right_encoders: [right_drive.encoder]
    wheel_radius_m: 0.12
    wheel_base_m: 0.6
  components:
    left_drive:
      component: ddsm115
      mount_link: left_wheel_mount
      driver:
        connection: { type: can, bus: 0, node_id: 1 }
    front_camera:
      component: oak_d_lite
      mount_link: front_camera_mount
      driver:
        connection: { type: usb }
      roles:
        rgb: [localization]
        depth: [localization, mapping, traversability]

artifacts:
  channel: stable
  pins:
    phoxal/component-oak_d_lite:
      git: https://github.com/phoxal/framework
      rev: main
      directory: component/oak_d_lite
    phoxal/component-ddsm115:
      git: https://github.com/phoxal/framework
      rev: main
      directory: component/ddsm115
    phoxal/component-passive_caster:
      path: ./components/passive_caster

services:
  mission_behavior:
    path: ./runtimes/mission_behavior
  inspection_policy:
    path: ./runtimes/inspection_policy
