[package]
name = "phoxal-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish = ["phoxal-internal"]

# The project/build/deploy tool and the disposable attached client.
# It is bin-only: the shipped executable is `phoxal`, and
# nothing links this package as a library, so its unit tests live in
# `#[cfg(test)]` modules inside the binary crate. The one thing under `tests/`
# links nothing of it: it reads the workspace's own resolved dependency graph
# back out of `cargo metadata`, which is a fact about the manifests rather than
# about any compiled code.
[[bin]]
name = "phoxal"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
console = { workspace = true }
flate2 = { workspace = true }
gilrs = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
self_replace = { workspace = true }
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# The framework train: `phoxal::session` for everything remote, and the
# bundle/authoring/identity modules beside it for local work.
phoxal = { workspace = true }

phoxal-cli-catalog = { workspace = true }
phoxal-cli-host = { workspace = true }
phoxal-cli-observation = { workspace = true }
phoxal-cli-project = { workspace = true }
phoxal-cli-ui = { workspace = true }

tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
