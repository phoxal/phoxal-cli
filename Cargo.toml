[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
publish = false
description = "Phoxal robot framework — phoxal-cli."
documentation = "https://github.com/phoxal/phoxal-cli#readme"
homepage = "https://github.com/phoxal/phoxal-cli"
repository = "https://github.com/phoxal/phoxal-cli"

[workspace]
resolver = "3"
members = [
    "."
]

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
chrono = { version = "0.4.42", default-features = false, features = ["serde", "std"] }
console = "0.15.11"
hex = "0.4.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "fs"] }
toml = "0.9.8"
tracing-subscriber = "0.3.23"
phoxal-engine = { git = "https://github.com/phoxal/framework", branch = "main" }
phoxal-utils-helpers = { git = "https://github.com/phoxal/framework", branch = "main" }
phoxal-utils-robot = { git = "https://github.com/phoxal/framework", branch = "main" }

[workspace.lints.rust]
unused = "warn"

[profile.release]
lto = false
codegen-units = 16

[package]
name = "phoxal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
chrono = { workspace = true }
console = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true, features = ["serde"] }
sha2 = { workspace = true }
hex = { workspace = true }

phoxal-utils-helpers = { workspace = true }
phoxal-utils-robot = { workspace = true }
phoxal-engine = { workspace = true }
tokio = { workspace = true, features = ["full"] }
dotenvy = "0.15.7"
tempfile = { workspace = true }
toml = { workspace = true }
