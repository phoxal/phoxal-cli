[workspace.package]
version = "0.39.3"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Phoxal robot framework - phoxal-cli."
documentation = "https://github.com/phoxal/phoxal-cli#readme"
homepage = "https://github.com/phoxal/phoxal-cli"
repository = "https://github.com/phoxal/phoxal-cli"

# `cli/` is the one shipped application. `phoxal-client/` is the reusable,
# unpublished remote-session boundary, and everything under `crates/` is
# CLI-specific implementation. The framework train owns `phoxal-supervisor`;
# this workspace only materializes that exact-train package for robot releases.
[workspace]
resolver = "3"
members = [
    "cli",
    "crates/catalog",
    "phoxal-client",
    "crates/host",
    "crates/observation",
    "crates/project",
    "crates/ui",
]

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.15.11"
tuirealm = { version = "4.1.0", default-features = false, features = ["derive", "crossterm", "async-ports"] }
dirs = "5"
flate2 = "1.1.9"
heck = "0.5.0"
hex = "0.4.3"
libc = "0.2.186"
nalgebra = { version = "0.34.2", features = ["serde-serialize"] }
object = "0.36"
pathdiff = "0.2.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
self_replace = { package = "self-replace", version = "1.5.0" }
sha2 = "0.11.0"
tar = "0.4.44"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "fs"] }
tokio-util = { version = "0.7", default-features = false }
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
webots-proto = "0.2.0"
gilrs = "0.11.2"
jsonschema = { version = "0.46.6", default-features = false }
thiserror = "2.0.18"

# The framework train. Every crate in this workspace speaks one train, so the
# pins live here and nowhere else.
phoxal-protocol = "0.64"
phoxal-bundle = "0.64"
phoxal-bus = "0.64"
phoxal-manifest = "0.64"
phoxal-model = "0.64"
phoxal-runtime-contract = "0.64"

# The external client boundary. Anything in this workspace that speaks to a
# running robot depends on this and not on the wire crates above.
phoxal-client = { path = "phoxal-client" }

phoxal-cli-catalog = { path = "crates/catalog" }
phoxal-cli-host = { path = "crates/host" }
phoxal-cli-observation = { path = "crates/observation" }
phoxal-cli-project = { path = "crates/project" }
phoxal-cli-ui = { path = "crates/ui" }

[workspace.lints.rust]
unused = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = false
codegen-units = 16
