[workspace.package]
version = "0.43.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Phoxal robot framework - phoxal-cli."
documentation = "https://github.com/phoxal/phoxal-cli#readme"
homepage = "https://github.com/phoxal/phoxal-cli"
repository = "https://github.com/phoxal/phoxal-cli"

# `cli/` is the one shipped application and everything under `crates/` is
# CLI-specific implementation. The remote-session boundary is no longer one of
# them: it is `phoxal::session`, owned by the framework train, which also owns
# `phoxal-supervisor`; this workspace only materializes that exact-train package
# for robot releases.
[workspace]
resolver = "3"
members = [
    "cli",
    "crates/catalog",
    "crates/host",
    "crates/observation",
    "crates/project",
    "crates/ui",
]

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.15.11"
tuirealm = { version = "4.1.0", default-features = false, features = ["derive", "crossterm", "async-ports"] }
dirs = "5"
flate2 = "1.1.9"
hex = "0.4.3"
libc = "0.2.186"
object = "0.36"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
self_replace = { package = "self-replace", version = "1.5.0" }
sha2 = "0.11.0"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tar = "0.4.44"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "fs"] }
tokio-util = { version = "0.7", default-features = false }
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
gilrs = "0.11.2"
jsonschema = { version = "0.46.6", default-features = false }

# The framework train, as one library. Every crate in this workspace speaks one
# train, so the pin lives here and nowhere else.
#
# `session` is the attachment SDK - `phoxal::session`, the runtime and
# supervisor contract families, the launch encoder, the participant-metadata
# reader - and `authoring` is the authored-source layer behind `phoxal build`.
# The participant profile is deliberately off: the CLI builds and launches
# participants, it never is one.
phoxal = { version = "0.68", default-features = false, features = ["session", "authoring"] }

phoxal-cli-catalog = { path = "crates/catalog" }
phoxal-cli-host = { path = "crates/host" }
phoxal-cli-observation = { path = "crates/observation" }
phoxal-cli-project = { path = "crates/project" }
phoxal-cli-ui = { path = "crates/ui" }

[workspace.lints.rust]
unused = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = false
codegen-units = 16
