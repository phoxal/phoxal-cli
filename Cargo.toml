[workspace.package]
version = "0.33.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Phoxal robot framework - phoxal-cli."
documentation = "https://github.com/phoxal/phoxal-cli#readme"
homepage = "https://github.com/phoxal/phoxal-cli"
repository = "https://github.com/phoxal/phoxal-cli"

[workspace]
resolver = "3"
members = [
    ".",
    "crates/client",
    "crates/core",
    "crates/observation",
    "crates/project",
    "crates/protocol",
    "crates/supervisor",
    "crates/ui",
    "xtask",
]
default-members = [
    ".",
    "crates/client",
    "crates/core",
    "crates/observation",
    "crates/project",
    "crates/protocol",
    "crates/supervisor",
    "crates/ui",
]

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.15.11"
tuirealm = { version = "4.1.0", default-features = false, features = ["derive", "crossterm", "async-ports"] }
dirs = "5"
flate2 = "1.1.9"
getrandom = "0.3.4"
heck = "0.5.0"
hex = "0.4.3"
libc = "0.2.186"
nalgebra = { version = "0.34.2", features = ["serde-serialize"] }
object = "0.36"
pathdiff = "0.2.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
self_replace = { package = "self-replace", version = "1.5.0" }
sha2 = "0.11.0"
tar = "0.4.44"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "fs"] }
tokio-util = { version = "0.7", default-features = false }
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
webots-proto = "0.2.0"
gilrs = "0.11.2"
phoxal-api = "=0.52.0"
phoxal-bus = "=0.52.0"
phoxal-manifest = "=0.52.0"
phoxal-model = "=0.52.0"
phoxal-runtime-contract = "=0.52.0"
phoxal-cli-client = { path = "crates/client" }
phoxal-cli-core = { path = "crates/core" }
phoxal-cli-observation = { path = "crates/observation" }
phoxal-cli-project = { path = "crates/project" }
phoxal-cli-protocol = { path = "crates/protocol" }
phoxal-cli-supervisor = { path = "crates/supervisor" }
phoxal-cli-ui = { path = "crates/ui" }


[workspace.lints.rust]
unused = "warn"

[profile.release]
lto = false
codegen-units = 16

[package]
name = "phoxal-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

# The shipped executable is `phoxal`; the package stays `phoxal-cli` because the
# crate name `phoxal` is taken by the framework on crates.io.
[[bin]]
name = "phoxal"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
console = { workspace = true }
flate2 = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true, features = ["serde"] }
self_replace = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tar = { workspace = true }

phoxal-cli-client = { workspace = true }
phoxal-cli-core = { workspace = true }
phoxal-cli-observation = { workspace = true }
phoxal-cli-project = { workspace = true }
phoxal-cli-protocol = { workspace = true }
phoxal-cli-supervisor = { workspace = true }
phoxal-cli-ui = { workspace = true }
phoxal-manifest = { workspace = true }
phoxal-model = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
dotenvy = "0.15.7"
tempfile = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
