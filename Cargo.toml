[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Phoxal robot framework — phoxal-cli."
documentation = "https://github.com/phoxal/phoxal-cli#readme"
homepage = "https://github.com/phoxal/phoxal-cli"
repository = "https://github.com/phoxal/phoxal-cli"

[workspace]
resolver = "3"
members = [
    "."
]

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
chrono = { version = "0.4.42", default-features = false, features = ["serde", "std"] }
console = "0.15.11"
dirs = "5"
flate2 = "1.1.9"
heck = "0.5.0"
hex = "0.4.3"
nalgebra = { version = "0.34.2", features = ["serde-serialize"] }
pathdiff = "0.2.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
sha2 = "0.11.0"
tar = "0.4.44"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "fs"] }
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
urdf-rs = "0.9.0"
webots-proto = "0.1.3"
phoxal-core-component = { git = "https://github.com/phoxal/framework", branch = "main" }
phoxal-core-engine = { git = "https://github.com/phoxal/framework", branch = "main" }
phoxal-infra-helpers = { git = "https://github.com/phoxal/framework", branch = "main" }
phoxal-core-robot = { git = "https://github.com/phoxal/framework", branch = "main" }
phoxal-core-simulation = { git = "https://github.com/phoxal/framework", branch = "main" }
phoxal-core-structure = { git = "https://github.com/phoxal/framework", branch = "main" }

[workspace.lints.rust]
unused = "warn"

[profile.release]
lto = false
codegen-units = 16

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package]
name = "phoxal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
chrono = { workspace = true }
console = { workspace = true }
dirs = { workspace = true }
flate2 = { workspace = true }
heck = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true, features = ["serde"] }
nalgebra = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
pathdiff = { workspace = true }
tar = { workspace = true }

phoxal-core-component = { workspace = true }
phoxal-infra-helpers = { workspace = true }
phoxal-core-robot = { workspace = true }
phoxal-core-engine = { workspace = true }
phoxal-core-simulation = { workspace = true }
phoxal-core-structure = { workspace = true }
tokio = { workspace = true, features = ["full"] }
dotenvy = "0.15.7"
tempfile = { workspace = true }
toml = { workspace = true }
urdf-rs = { workspace = true }
webots-proto = { workspace = true }
